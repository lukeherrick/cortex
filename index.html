<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the app paint into the area behind the notch and
      the home indicator on an iPhone; the safe-area insets in styles.css keep
      content clear of both.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Cortex</title>
    <meta
      name="description"
      content="Answer first, read second. Spaced practice for AP Biology and Honors Chemistry."
    />

    <!-- Matches the light and dark page backgrounds, so the iOS status bar
         blends with the app instead of sitting on a white strip. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fffdf7"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#15171a"
    />

    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cortex" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

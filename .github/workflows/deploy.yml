name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. A queued run waits rather than being cancelled,
# so a push always ends with the site matching main.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gates used locally. A broken question file or a failing test
      # stops the deploy rather than shipping.
      - name: Test
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          # Project pages are served from /cortex/, and the manifest start_url,
          # service worker scope and every asset URL have to agree with that.
          CORTEX_BASE: /cortex/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
